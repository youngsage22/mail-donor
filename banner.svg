<svg width="1200" height="300" viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0a1e"/>
      <stop offset="50%" style="stop-color:#1a0b35"/>
      <stop offset="100%" style="stop-color:#0d1b3e"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#a78bfa"/>
      <stop offset="50%" style="stop-color:#7c3aed"/>
      <stop offset="100%" style="stop-color:#06b6d4"/>
    </linearGradient>
    <linearGradient id="pillGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#7c3aed;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#06b6d4;stop-opacity:0.3"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softglow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="300" fill="url(#bg)" rx="12"/>

  <!-- Subtle grid lines -->
  <g opacity="0.06" stroke="#7c3aed" stroke-width="1">
    <line x1="0" y1="60" x2="1200" y2="60"/>
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="180" x2="1200" y2="180"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="200" y1="0" x2="200" y2="300"/>
    <line x1="400" y1="0" x2="400" y2="300"/>
    <line x1="600" y1="0" x2="600" y2="300"/>
    <line x1="800" y1="0" x2="800" y2="300"/>
    <line x1="1000" y1="0" x2="1000" y2="300"/>
  </g>

  <!-- Glowing orbs -->
  <circle cx="150" cy="150" r="120" fill="#7c3aed" opacity="0.08"/>
  <circle cx="1050" cy="150" r="100" fill="#06b6d4" opacity="0.08"/>
  <circle cx="600" cy="280" r="80" fill="#a78bfa" opacity="0.06"/>

  <!-- Decorative envelope icon -->
  <g transform="translate(80, 95)" filter="url(#softglow)">
    <rect x="0" y="20" width="100" height="70" rx="6" fill="none" stroke="#7c3aed" stroke-width="2.5" opacity="0.8"/>
    <polyline points="0,20 50,62 100,20" fill="none" stroke="#a78bfa" stroke-width="2.5" opacity="0.8"/>
    <line x1="0" y1="90" x2="30" y2="60" stroke="#7c3aed" stroke-width="2" opacity="0.6"/>
    <line x1="100" y1="90" x2="70" y2="60" stroke="#7c3aed" stroke-width="2" opacity="0.6"/>
    <!-- Pulse dot -->
    <circle cx="85" cy="15" r="8" fill="#06b6d4" opacity="0.9" filter="url(#glow)"/>
    <circle cx="85" cy="15" r="4" fill="white"/>
  </g>

  <!-- Main title -->
  <text x="220" y="130" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif" font-size="72" font-weight="800" fill="url(#titleGrad)" filter="url(#glow)" letter-spacing="-2">Mail Donor</text>

  <!-- Tagline -->
  <text x="222" y="172" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif" font-size="22" fill="#a78bfa" opacity="0.9" letter-spacing="0.5">Real disposable inboxes. Instant. Free. No signup.</text>

  <!-- Pill badges -->
  <g transform="translate(222, 198)">
    <!-- React pill -->
    <rect x="0" y="0" width="80" height="28" rx="14" fill="url(#pillGrad)" stroke="#7c3aed" stroke-width="1" opacity="0.8"/>
    <text x="40" y="19" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#c4b5fd">⚛ React</text>

    <!-- TypeScript pill -->
    <rect x="88" y="0" width="110" height="28" rx="14" fill="url(#pillGrad)" stroke="#3178c6" stroke-width="1" opacity="0.8"/>
    <text x="143" y="19" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#93c5fd">TS TypeScript</text>

    <!-- Vite pill -->
    <rect x="206" y="0" width="70" height="28" rx="14" fill="url(#pillGrad)" stroke="#646cff" stroke-width="1" opacity="0.8"/>
    <text x="241" y="19" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#a5b4fc">⚡ Vite</text>

    <!-- No backend pill -->
    <rect x="284" y="0" width="110" height="28" rx="14" fill="none" stroke="#06b6d4" stroke-width="1" opacity="0.8"/>
    <text x="339" y="19" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#67e8f9">✓ No Backend</text>
  </g>

  <!-- Right side: fake inbox preview -->
  <g transform="translate(840, 30)">
    <rect x="0" y="0" width="320" height="240" rx="10" fill="#1a0b35" stroke="#7c3aed" stroke-width="1.5" opacity="0.9"/>
    <!-- Header bar -->
    <rect x="0" y="0" width="320" height="40" rx="10" fill="#2d1b4e"/>
    <rect x="0" y="30" width="320" height="10" fill="#2d1b4e"/>
    <circle cx="20" cy="20" r="6" fill="#ff5f57"/>
    <circle cx="38" cy="20" r="6" fill="#febc2e"/>
    <circle cx="56" cy="20" r="6" fill="#28c840"/>
    <text x="160" y="25" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="11" fill="#a78bfa" font-weight="600">📬 Inbox</text>

    <!-- Email address bar -->
    <rect x="12" y="50" width="296" height="32" rx="6" fill="#0f0a1e" stroke="#7c3aed" stroke-width="1" opacity="0.8"/>
    <text x="20" y="71" font-family="'Courier New', monospace" font-size="12" fill="#c4b5fd">k7xm2p@web-library.net</text>
    <rect x="258" y="55" width="44" height="22" rx="4" fill="#7c3aed" opacity="0.8"/>
    <text x="280" y="70" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="10" fill="white" font-weight="600">Copy</text>

    <!-- Live indicator -->
    <circle cx="22" cy="103" r="4" fill="#22c55e"/>
    <text x="32" y="108" font-family="'Segoe UI', sans-serif" font-size="10" fill="#86efac">Live · checking every 5s</text>

    <!-- Email rows -->
    <rect x="12" y="118" width="296" height="36" rx="6" fill="#2d1b4e" opacity="0.6"/>
    <text x="22" y="133" font-family="'Segoe UI', sans-serif" font-size="11" fill="#e2e8f0">📩 Verify your Spotify account</text>
    <text x="22" y="148" font-family="'Segoe UI', sans-serif" font-size="10" fill="#7c3aed">2 min ago</text>

    <rect x="12" y="160" width="296" height="36" rx="6" fill="#1a0b35" opacity="0.6"/>
    <text x="22" y="175" font-family="'Segoe UI', sans-serif" font-size="11" fill="#e2e8f0">📩 Welcome to Linear!</text>
    <text x="22" y="190" font-family="'Segoe UI', sans-serif" font-size="10" fill="#7c3aed">8 min ago</text>

    <rect x="12" y="202" width="296" height="30" rx="6" fill="#1a0b35" opacity="0.4"/>
    <text x="22" y="222" font-family="'Segoe UI', sans-serif" font-size="11" fill="#64748b">📩 Your OTP is 847291</text>
  </g>
</svg>
